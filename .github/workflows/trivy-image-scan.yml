name: Trivy Container Image Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build vulnerable test image
        run: |
          docker build -t trivy-test:vulnerable .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "trivy-test:vulnerable"
          scan-type: "image"
          scanners: "vuln"
          severity: "CRITICAL,HIGH,MEDIUM"
          format: "sarif"
          output: "trivy-results.sarif"
          exit-code: "0"

      - name: Upload Trivy results to DefectDojo
        if: always()
        run: |
          curl --fail-with-body \
            -X POST "http://35.202.90.152:8080/api/v2/import-scan/" \
            -H "Authorization: Token 005cb8db196eacd1b62dca62cb11d939749c1a34" \
            -F "scan_type=SARIF" \
            -F "engagement=10" \
            -F "file=@trivy-results.sarif" \
            -F "active=true" \
            -F "verified=true" \
            -F "minimum_severity=Info"

      - name: Upload Trivy results to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

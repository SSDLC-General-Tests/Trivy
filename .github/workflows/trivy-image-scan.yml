name: Trivy Container Image Scan

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build vulnerable test image
        run: |
          docker build -t trivy-test:vulnerable .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "trivy-test:vulnerable"
          scan-type: "image"
          scanners: "vuln"
          severity: "CRITICAL,HIGH,MEDIUM"
          format: "table"
          exit-code: "0"
